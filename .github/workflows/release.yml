name: Release

on:
  push:
    tags:
      - "*"

jobs:
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      release-id: ${{ steps.create-release.outputs.release-id }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ${{ contains(steps.get_version.outputs.VERSION, 'canary') }}; then
            release_output=$(gh release create ${{ steps.get_version.outputs.VERSION }} \
              --prerelease \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}")
          else
            release_output=$(gh release create ${{ steps.get_version.outputs.VERSION }} \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}")
          fi
          release_id=$(echo "$release_output" | grep -o 'releases/[0-9]*' | cut -d'/' -f2)
          echo "release-id=$release_id" >> $GITHUB_OUTPUT

  upload-assets:
    name: "Upload assets"
    needs: github-release
    strategy:
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            runs-on: ubuntu-24.04
          - name: ubuntu-24.04_arm64
            runs-on: ubuntu-24.04-arm
          - name: ubuntu-22.04_x86_64
            runs-on: ubuntu-22.04
          - name: ubuntu-22.04_arm64
            runs-on: ubuntu-22.04-arm
          - name: macos-26_arm64
            runs-on: macos-26
          - name: macos-15_arm64
            runs-on: macos-15
          - name: macos-14_arm64
            runs-on: macos-14
          - name: windows-2025_x86_64
            runs-on: windows-2025
    runs-on: ${{ matrix.platform.runs-on }}
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: rustup update stable
      - run: rustup default stable

      - name: Build
        run: cargo build --release --package shiguredo_srt_c_api

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}/lib/
          mkdir -p srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}/include/
          cp $(ls target/release/libsrt.* | grep -E '\.(a|so|dylib)$') srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}/lib/
          cp crates/c-api/include/srt.h srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}/include/
          tar -czf srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}.tar.gz \
            srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.github-release.outputs.version }}"
          $platform = "${{ matrix.platform.name }}"
          $dir = "srt-${version}_${platform}"
          New-Item -ItemType Directory -Path "${dir}/lib" -Force
          New-Item -ItemType Directory -Path "${dir}/include" -Force
          Copy-Item -Path "target/release/srt.dll" -Destination "${dir}/lib/"
          Copy-Item -Path "target/release/srt.lib" -Destination "${dir}/lib/"
          Copy-Item -Path "crates/c-api/include/srt.h" -Destination "${dir}/include/"
          Compress-Archive -Path "${dir}" -DestinationPath "srt-${version}_${platform}.zip"

      - name: Upload Release Asset (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.github-release.outputs.version }} \
            srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}.tar.gz

      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.github-release.outputs.version }} srt-${{ needs.github-release.outputs.version }}_${{ matrix.platform.name }}.zip

  publish:
    needs: [github-release, upload-assets]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  slack_notify:
    needs: [github-release, upload-assets, publish]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: hisui
          notify_mode: failure_and_fixed
          slack_icon_emoji_failure: ":japanese_ogre:"
        env:
          GH_TOKEN: ${{ github.token }}
