# Based on https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md

name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  schedule:
    # UTC の 01:00 は JST だと 10:00 。
    # 1-5 で 月曜日から金曜日
    - cron: "0 1 * * 1-5"

jobs:
  check:
    name: Check
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-26
        toolchain:
          - stable
          - beta
          - nightly
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update ${{ matrix.toolchain }}
      - run: rustup default ${{ matrix.toolchain }}
      - run: cargo check --workspace

  test:
    name: Test Suite
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-26
        toolchain:
          - stable
          - beta
          - nightly
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update ${{ matrix.toolchain }}
      - run: rustup default ${{ matrix.toolchain }}
      - run: rustup show

      - run: cargo build --workspace --exclude fuzz
      - run: cargo test --workspace --exclude fuzz

  lints:
    name: Lints
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-26
        toolchain:
          # [NOTE]
          # clippy は「stable と nightly の片方に対応したらもう片方で失敗する」といったケースが
          # まれにあるのと、そもそも nightly のチェックを事前に行うメリットが
          # 薄い（lint で警告がでても、別に普通に使う分には問題はない）ので、
          # ここでは stable だけを使っている
          - stable
          # - beta
          # - nightly
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update ${{ matrix.toolchain }}
      - run: rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings

  build-c-api:
    name: Build C API Library
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: ubuntu-24.04_x86_64
          - os: ubuntu-24.04-arm
            artifact-name: ubuntu-24.04_arm64
          - os: windows-2025
            artifact-name: windows-2025_x86_64
          - os: macos-26
            artifact-name: macos-26_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - run: rustup update stable
      - run: rustup default stable

      - name: Build C API
        run: cargo build --release --package shiguredo_srt_c_api

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts/lib artifacts/include
          cp $(ls target/release/libsrt.* | grep -E '\.(a|so|dylib)$') artifacts/lib/
          cp crates/c-api/include/srt.h artifacts/include/

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "artifacts/lib" -Force
          New-Item -ItemType Directory -Path "artifacts/include" -Force
          Copy-Item -Path "target/release/srt.dll" -Destination "artifacts/lib/"
          Copy-Item -Path "target/release/srt.lib" -Destination "artifacts/lib/"
          Copy-Item -Path "crates/c-api/include/srt.h" -Destination "artifacts/include/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c-api-${{ matrix.artifact-name }}
          path: artifacts/

  slack_notify_failed:
    needs: [check, test, lints, build-c-api]
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: hisui
          SLACK_COLOR: danger
          SLACK_ICON_EMOJI: ":japanese_ogre:"
          SLACK_TITLE: "FAILED"
          SLACK_MESSAGE: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{github.event.head_commit.message || 'Scheduled run'}}>
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
