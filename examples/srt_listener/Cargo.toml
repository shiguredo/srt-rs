[package]
name = "srt_listener"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aws-lc-rs = "1.17"
mpeg2ts = "0.6"
noargs = "0.4"
shiguredo_mp4 = "2026.3"
shiguredo_srt = { path = "../.." }
tokio = {
  version = "1.52",
  features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
  ]
}
# ログ出力 (ユーザー向け表示を eprintln から移行する)
tracing = "0.1"
# ライブラリの tracing ログ出力先を設定する (--debug で level を debug に上げる)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
