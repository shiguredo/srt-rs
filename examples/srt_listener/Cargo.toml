[package]
name = "srt_listener"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
shiguredo_srt = { path = "../.." }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
] }
noargs = "0.4"
mpeg2ts = "0.5"
shiguredo_mp4 = "2026.3"
aws-lc-rs = "1.16"
# ライブラリの tracing ログ出力先を設定する (--debug で level を debug に上げる)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
