[package]
name = "shiguredo_srt"
version = "2026.1.0-canary.0"
edition = "2024"
rust-version = "1.88"
description = "SRT (Secure Reliable Transport) library"
readme = "README.md"
homepage = "https://github.com/shiguredo/srt-rs"
repository = "https://github.com/shiguredo/srt-rs"
license = "Apache-2.0"

[workspace]
members = [
  "crates/c-api",
  "examples/srt_caller",
  "examples/srt_listener",
  "pbt",
]
exclude = ["fuzz"]

[dependencies]
aws-lc-rs = "1.16"
